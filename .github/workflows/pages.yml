name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish slim tree to gh-pages
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pages is legacy / gh-pages. Media stays on main; free jsDelivr serves it.
          # workflow deploy-pages was timing out on sync even for ~12MB artifacts.
          mkdir -p _pages
          for item in *; do
            case "$item" in
              images|thumbs|posters|_pages|.git|.github) ;;
              *) cp -a "$item" _pages/ ;;
            esac
          done
          touch _pages/.nojekyll
          python3 - <<'PY'
          import os, pathlib
          sha = os.environ["GITHUB_SHA"]
          cdn = f"https://cdn.jsdelivr.net/gh/Bin0754/gpt-image-gallery@{sha}/"
          # pages load their data from data/*.json; media (images/, thumbs/, posters/) is prefixed with
          # <html data-media="..."> so it is served by jsDelivr from this exact commit
          for page in ("_pages/index.html", "_pages/videos.html"):
              p = pathlib.Path(page)
              text = p.read_text(encoding="utf-8")
              if text.count('data-media=""') != 1:
                  raise SystemExit(f"data-media placeholder missing in {page}")
              p.write_text(text.replace('data-media=""', f'data-media="{cdn}"', 1), encoding="utf-8")
              print(page, "media base", cdn)
          PY
          du -sh _pages
          cd _pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          COUNT=$(python3 -c "import json;print(json.load(open('prompts.json'))['count'])")
          git commit -q -m "pages: ${COUNT} posts @${GITHUB_SHA:0:7} (media via jsDelivr)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/Bin0754/gpt-image-gallery.git"
          git push -f origin gh-pages
          echo "Pushed gh-pages for ${COUNT} posts"
