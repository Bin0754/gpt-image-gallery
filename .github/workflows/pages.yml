name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare slim Pages tree
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p _pages
          # Media stays in git; Pages only gets HTML/JSON/CSV/docs (few files).
          # Free jsDelivr serves images/thumbs/posters from this same public repo.
          for item in *; do
            case "$item" in
              images|thumbs|posters|_pages|.git|.github) ;;
              *) cp -a "$item" _pages/ ;;
            esac
          done
          # Drop bulky downloadables that are also in the git repo (optional for browsing).
          # Keep prompts.json (small) for the UI / download links; drop large CSV duplicates? keep them — still tiny vs media.
          python3 - <<'PY'
          import os, pathlib
          sha = os.environ["GITHUB_SHA"]
          cdn = f"https://cdn.jsdelivr.net/gh/Bin0754/gpt-image-gallery@{sha}/"
          def rewrite(path, *pairs):
              p = pathlib.Path(path)
              text = p.read_text(encoding="utf-8")
              new = text
              for old, folder in pairs:
                  base = cdn + folder + "/"
                  new = new.replace(old, f'"{base}')
                  n = new.count(base)
                  print(f"{path}: {n} x {folder}/")
                  if n < 50:
                      raise SystemExit(f"rewrite failed for {folder} in {path}: {n}")
              p.write_text(new, encoding="utf-8")
          rewrite("_pages/index.html", ('"images/', "images"), ('"thumbs/', "thumbs"))
          rewrite("_pages/videos.html", ('"posters/', "posters"))
          print("CDN base", cdn)
          PY
          echo "Slim Pages tree size:"
          du -sh _pages
          find _pages -type f | wc -l
          du -sh _pages/* 2>/dev/null | sort -hr | head -20
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
