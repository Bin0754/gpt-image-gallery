name: 推荐提示词 / Submit a prompt
description: 推荐一条 X 上公开分享了提示词的 GPT Image 2.5 作品
title: "[推荐] "
labels: ["prompt-submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢推荐！只收录**作者本人公开给出提示词**的 GPT Image 2.5 作品（正文、作者自回复或图片 ALT 文本中）。
        Thanks! We only include GPT Image 2.5 posts where the author publicly shared the prompt.
  - type: input
    id: post_url
    attributes:
      label: X 原帖链接 / Post URL
      placeholder: https://x.com/username/status/1234567890
    validations:
      required: true
  - type: dropdown
    id: prompt_location
    attributes:
      label: 提示词在哪里？/ Where is the prompt?
      options:
        - 帖子正文 / In the post text
        - 作者本人的回复 / In the author's own reply
        - 图片 ALT 文本 / In the image ALT text
    validations:
      required: true
  - type: input
    id: reply_url
    attributes:
      label: 如果在回复里，回复链接 / Reply URL (if applicable)
  - type: textarea
    id: notes
    attributes:
      label: 补充说明 / Notes
      description: 例如为什么推荐、作品亮点 / Anything else
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认 / Confirm
      options:
        - label: 帖子是公开的，并且明确提到使用 GPT Image 2.5 / The post is public and says it was made with GPT Image 2.5
          required: true
        - label: 内容不含 NSFW / No NSFW content
          required: true
